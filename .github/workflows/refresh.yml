name: Daily menu refresh

# R&DE only exposes a rolling seven-day window, so anything not scraped while it
# is visible is gone for good. This job is the only reason the archive in data/
# goes back further than a week.

on:
  schedule:
    # Four times a day. R&DE edits today's and the coming days' menus during
    # the day -- the afternoon scrape found changed meals in days already on
    # file every day in September 2026 -- so twice a day left the board wrong
    # until dinner. GitHub starts scheduled runs late: in September 2026 the
    # 08:30 UTC slot started around 13:30 and the 21:30 slot around 23:50. The
    # slots are set against those delays, so each run should land about when
    # it is useful (PDT; PST is an hour earlier):
    #   03:17 UTC, 20:17 PT: tomorrow's edits, drawn overnight
    #   08:17 UTC, 01:17 PT: the window rolls to a new day; lands before breakfast
    #   15:17 UTC, 08:17 PT: lands before lunch
    #   20:17 UTC, 13:17 PT: lands before dinner
    # Off the hour and the half hour, where GitHub's scheduler is busiest.
    - cron: "17 3,8,15,20 * * *"
  workflow_dispatch:

# A late run can start while the next one is still going; two scrapes
# committing data/ at once would race to push.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write   # the night's menus

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Scrape the menu window
        run: uv run python scripts/update.py

      # Gemma on the Gemini API's free tier. Deliberately not given the
      # Cloudflare secrets: its free neurons are the only free image generator
      # there is, and translation used to spend them before a picture was drawn.
      - name: Translate missing menu items
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python scripts/translate.py

      # No drawing here: draw.yml does it once this run has finished, on
      # several machines at once, because a picture takes a CPU a quarter of
      # an hour and this job has a scrape to commit.

      # always(), because the night's menus and assets are worth keeping whatever
      # else the run turns up -- the source holds seven days and no more.
      - name: Commit refreshed menus and assets
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No menu or asset changes."
            exit 0
          fi
          git commit -qm "data: refresh menus and assets for $(date -u +%Y-%m-%d)"
          # draw.yml's collect, or a laptop, may have pushed since this run
          # checked out; replay the scrape on top of main as it is now. The one
          # file both sides write is data/dishes.json -- the scrape re-derives
          # it, a draw records pictures in it -- so a conflict there is settled
          # by taking main's and deriving over it again: the carry-over in
          # catalog.build() keeps the pictures, the menus just scraped give the
          # rest. A conflict anywhere else is for a person, and the next scrape
          # picks the menus up again meanwhile.
          for attempt in 1 2 3; do
            if git push -q; then exit 0; fi
            git fetch -q origin main
            if ! git rebase -q origin/main; then
              if [ "$(git diff --name-only --diff-filter=U)" != "data/dishes.json" ]; then
                git rebase --abort
                exit 1
              fi
              git checkout -q --ours data/dishes.json   # mid-rebase, "ours" is main
              uv run python scripts/rebuild_catalog.py
              git add data/dishes.json
              GIT_EDITOR=true git rebase --continue
            fi
          done
          exit 1

      # Last, and on purpose. R&DE adding a dining hall is not something the
      # scrape can act on -- a hall needs a menu_key, a schedule, aliases, an
      # address and a crop box, and the dropdown carries one of those -- but it
      # is something a person has to act on tonight, because the source keeps
      # seven days and every night that passes is a night of that hall's menus
      # gone. A warning in a green log is the silence we already had, so the run
      # goes red and GitHub sends the mail. By here the data is committed and
      # publish is on its way, so going red costs nothing but the tick.
      - name: Check what the source is offering
        run: uv run python scripts/check_source.py


  # Called, not triggered. A push made with GITHUB_TOKEN deliberately does not
  # fire `on: push`, so without this the daily scrape would commit new menus and
  # never publish them.
  publish:
    needs: refresh
    # Publishes even when refresh went red: a red run means somebody has to edit
    # config, not that today's menus should be withheld. Only a cancellation
    # stops it.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
