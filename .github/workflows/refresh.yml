name: Daily menu refresh

# R&DE only exposes a rolling seven-day window, so anything not scraped while it
# is visible is gone for good. This job is the only reason the archive in data/
# goes back further than a week.

on:
  schedule:
    # Run twice daily:
    # 08:30 UTC is 01:30 PT, after R&DE has rolled the window to the next day at midnight.
    # 21:30 UTC is 14:30 PT, after lunch, catching afternoon updates before dinner.
    - cron: "30 8,21 * * *"
  workflow_dispatch:

permissions:
  contents: write   # the night's menus

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Scrape the menu window
        run: uv run python scripts/update.py

      - name: Translate missing menu items
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: uv run python scripts/translate.py

      - name: Generate pending dish images
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: uv run python scripts/gen_images.py --limit 50

      # always(), because the night's menus and assets are worth keeping whatever
      # else the run turns up -- the source holds seven days and no more.
      - name: Commit refreshed menus and assets
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No menu or asset changes."
          else
            git commit -m "data: refresh menus and assets for $(date -u +%Y-%m-%d)"
            git push
          fi

      # Last, and on purpose. R&DE adding a dining hall is not something the
      # scrape can act on -- a hall needs a menu_key, a schedule, aliases, an
      # address and a crop box, and the dropdown carries one of those -- but it
      # is something a person has to act on tonight, because the source keeps
      # seven days and every night that passes is a night of that hall's menus
      # gone. A warning in a green log is the silence we already had, so the run
      # goes red and GitHub sends the mail. By here the data is committed and
      # publish is on its way, so going red costs nothing but the tick.
      - name: Check what the source is offering
        run: uv run python scripts/check_source.py


  # Called, not triggered. A push made with GITHUB_TOKEN deliberately does not
  # fire `on: push`, so without this the daily scrape would commit new menus and
  # never publish them.
  publish:
    needs: refresh
    # Publishes even when refresh went red: a red run means somebody has to edit
    # config, not that today's menus should be withheld. Only a cancellation
    # stops it.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
