[project]
name = "bsdm"
version = "0.1.0"
description = "A better Stanford dining hall menu: scrape, illustrate, compare."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "Pillow>=10.0",
    # Reading the specials calendar means reading where its coloured bars are
    # drawn, not just its text; see bsdm/specials.py.
    "PyMuPDF>=1.24",
]

[dependency-groups]
# There is no runtime need for these; `uv sync` installs them anyway, which is
# what makes `make test` a one-liner on a fresh checkout and in CI.
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # PyMuPDF's swig bindings, on import. Nothing this project can act on.
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
markers = [
    "golden: reads a real artefact committed under data/ (posters, menus, config)",
    "node: needs a node binary to run web/app.js",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bsdm"]
