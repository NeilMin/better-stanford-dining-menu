[project]
name = "bsdm"
version = "0.1.0"
description = "A better Stanford dining hall menu: scrape, illustrate, compare."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "Pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bsdm"]
